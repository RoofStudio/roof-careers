<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />

    <title>Roof Studio — We want to meet you</title>
    <meta
      name="description"
      content="Somos a Roof Studio, e queremos te conhecer. Artistas, Diretores de Arte, Designers e Animadores obcecados por ofício."
    />
    <!-- white-1, the studio's own page color. -->
    <meta name="theme-color" content="#f5ebe1" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Roof Studio — We want to meet you" />
    <meta
      property="og:description"
      content="Sempre acreditamos que uma boa animação tem que parecer que você pode pegar na mão. Compartilhe seu trabalho com a gente."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Brand type: Ambit for the UI, GT-Alpina Light Italic for the note
         voice — the same two faces roofstudio.tv serves, self-hosted from
         public/fonts. No Google Fonts, no third-party request: the studio's
         own type is not on any CDN, and the page must not depend on one.

         Only the two faces that carry FIRST paint are preloaded — Ambit 600
         (the CREATIVE TALENT banner, every section title) and Ambit 400 (all
         body copy). GT-Alpina is 131KB and paints below the fold, so it stays
         on the stylesheet's own timing. -->
    <link
      rel="preload"
      href="/fonts/ambit-semibold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/ambit-regular.woff2" as="font" type="font/woff2" crossorigin />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!--
      Self-heal a stale HTML cache.

      GitHub Pages serves index.html with max-age=600 but DELETES the previous
      build's hashed assets on every deploy. So for ten minutes after a deploy a
      returning visitor gets cached HTML pointing at files that no longer exist:
      two 404s, an empty <div id="root">, and a blank page with no JavaScript
      running to notice. We cannot set cache headers on Pages, so the page
      checks on itself instead.

      Guarded by sessionStorage so it can only ever happen once — a reload loop
      would be far worse than the blank page it is fixing. Four seconds is long
      enough that a slow connection still mounts first; the cost of being wrong
      is one refresh.
    -->
    <script>
      setTimeout(function () {
        var root = document.getElementById("root")
        if (root && root.childElementCount === 0 && !sessionStorage.getItem("roof-stale-reload")) {
          try { sessionStorage.setItem("roof-stale-reload", "1") } catch (e) {}
          var url = new URL(location.href)
          url.searchParams.set("v", Date.now())
          location.replace(url.toString())
        }
      }, 4000)
    </script>
  </body>
</html>
